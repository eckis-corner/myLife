name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Für die Kreuztests JS ↔ .NET des Krypto-Kerns (tests/MyLife.Tests/Crypto)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet restore MyLife.slnx
      - run: dotnet build MyLife.slnx --no-restore -c Release
      - run: dotnet test --solution MyLife.slnx --no-build -c Release

  image:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mylife
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "value=1.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # mylife-decrypt (M3.5): eigenständige Dateien für Angehörige und Nachfolge, ohne installiertes .NET.
  # Bei jedem Push als Artefakt, bei einem Tag v* zusätzlich am GitHub-Release.
  decrypt-tool:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Veröffentlichen
        run: |
          for rid in win-x64 osx-arm64 osx-x64 linux-x64; do
            dotnet publish src/MyLife.Decrypt -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o "out/$rid"
            (cd "out/$rid" && zip -q "../../mylife-decrypt-$rid.zip" *)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mylife-decrypt
          path: mylife-decrypt-*.zip
      - name: Am Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" mylife-decrypt-*.zip --clobber
